upstream cango_api { server 127.0.0.1:4000; keepalive 32; }
upstream cango_admin { server 127.0.0.1:3001; keepalive 16; }
upstream cango_web { server 127.0.0.1:3002; keepalive 16; }
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Apex HTTP -> https://www (no certificate mismatch)
server {
    listen 80;
    listen [::]:80;
    server_name can-rides.ca;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.can-rides.ca$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.can-rides.ca;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.can-rides.ca$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.can-rides.ca;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://admin.can-rides.ca$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.can-rides.ca;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /socket.io/ {
        proxy_pass http://cango_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
    location / {
        proxy_pass http://cango_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        client_max_body_size 50m;
    }
}

# HTTPS www â valid Let's Encrypt cert
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.can-rides.ca;
    ssl_certificate /etc/letsencrypt/live/www.can-rides.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.can-rides.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://cango_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        client_max_body_size 50m;
    }
    location /socket.io/ {
        proxy_pass http://cango_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
    location / {
        proxy_pass http://cango_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

