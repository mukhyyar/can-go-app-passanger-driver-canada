# Production infra — bind only to localhost (Nginx/apps talk to these)
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cango-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cango
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cango_change_me}
      POSTGRES_DB: cango
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - cango_pg_data:/var/lib/postgresql/data
      - ../backend/prisma/init-postgis.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cango -d cango']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: cango-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - cango_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: cango-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cango}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cangominio_change_me}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - cango_minio_data:/data

volumes:
  cango_pg_data:
  cango_redis_data:
  cango_minio_data:
