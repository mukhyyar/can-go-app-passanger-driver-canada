name: driver
description: CAN-RIDE Driver prototype
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^15.1.2
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  gt_ui:
    path: ../../packages/gt_ui
  gt_mock:
    path: ../../packages/gt_mock
  gt_api:
    path: ../../packages/gt_api
  intl: ^0.20.2
  google_maps_flutter: ^2.12.1
  image_picker: ^1.1.2
  http: ^1.6.0
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.1
  geolocator: ^14.0.2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  google_sign_in: ^7.2.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# firebase_core_web 3.11.0 needs Dart 3.12+ (isA on Object). Pin until Flutter upgrades.
dependency_overrides:
  firebase_core_web: 3.10.0

flutter:
  uses-material-design: true
