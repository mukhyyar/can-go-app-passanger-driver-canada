name: gt_ui
description: Shared CAN-RIDE prototype UI kit
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.12.1
  intl: ^0.20.2
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/can-ride-mark.png
    - assets/can-ride-logo.png
    - assets/can-ride-logo-white.png
    - assets/can-ride-square.png
    - assets/can-ride-writing.png
    - assets/can-ride-car.png
    - assets/vehicles/
