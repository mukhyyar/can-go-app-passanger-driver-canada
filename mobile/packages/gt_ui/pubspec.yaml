name: gt_ui
description: Shared CAN-RIDE prototype UI kit
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.12.1
  # Pin maps packages to Dart 3.8 / Flutter 3.32 (local SDK). Newer interfaces need Dart 3.9+.
  google_maps_flutter_android: 2.18.3
  google_maps_flutter_platform_interface: 2.14.1
  intl: ^0.20.2
  local_auth: ^2.3.0
  crop_your_image: ^2.0.0
  image: ^4.5.4
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/can-ride-mark.png
    - assets/can-ride-logo.png
    - assets/can-ride-logo-white.png
    - assets/can-ride-square.png
    - assets/can-ride-writing.png
    - assets/can-ride-car.png
    - assets/vehicles/
    - assets/onboarding/
